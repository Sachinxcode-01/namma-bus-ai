name: Backend CI

on:
  push:
    branches: [main, master, develop, prem]
  pull_request:
    branches: [main, master, develop, prem]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nammabus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nammabus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix apps/api ci

      - name: Install API Dependencies
        run: npm --prefix apps/api ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/nammabus_test
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-16-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-16-chars

      - name: Build Production Artifacts
        run: npm run build
