version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nammabus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nammabus_dev
    ports:
      - '5432:5432'
    volumes:
      - nammabus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nammabus_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nammabus-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - nammabus_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nammabus_pgdata:
  nammabus_redisdata:
